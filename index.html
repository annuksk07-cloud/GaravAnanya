<!doctype html>
<html lang="en">
  <head>

    <title>Aarav &amp; Ananya | Wedding Invitation</title>
    <meta name="description" content="We invite you to celebrate the wedding of Aarav Sharma &amp; Ananya Verma on December 14, 2026 in Jaipur." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4A0E1C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aarav&amp;Ananya" />

    <!-- Preloads & Fonts -->
    <link rel="preload" as="image" href="https://lh3.googleusercontent.com/d/1zaZ2nIJZOj2RrS4ImbTrolJtmqeLhxGJ" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&family=Jost:wght@300;400&family=Pinyon+Script&family=Tiro+Devanagari+Hindi:ital@0;1&family=Yatra+One&display=swap" rel="stylesheet">

    <!-- Video Container, Skip Button & Video Overlay Styles -->
    <style>
      .video-container-wrapper {
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
        margin: 0 auto;
        position: relative;
        background: #000;
        overflow: hidden;
      }
      @keyframes envelopeTapPulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.85;
        }
      }
      .envelope-tap-text {
        position: absolute;
        left: 50%;
        top: calc(50% + 54px);
        transform: translateX(-50%);
        z-index: 60;
        font-family: 'Pinyon Script', cursive;
        font-weight: 400;
        color: #0e5f68;
        letter-spacing: 0.02em;
        text-transform: none;
        font-size: clamp(26px, 7vw, 36px);
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 0 1px 2px rgba(8, 22, 43, 0.25);
      }
      .envelope-tap-text.visible {
        opacity: 1;
        animation: envelopeTapPulse 2.4s ease-in-out 0.8s infinite;
      }
      .skip-btn-fixed {
        position: fixed;
        right: 4vw;
        bottom: max(4vh, env(safe-area-inset-bottom));
        z-index: 9999;
        width: 14vw;
        max-width: 60px;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: #08162b;
        border: 1px solid #d4a94f;
        font-family: 'Jost', sans-serif;
        font-size: clamp(9px, 2.4vw, 12px);
        letter-spacing: 0.1em;
        color: #f0d9a0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: auto;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
        text-transform: uppercase;
      }
      .skip-btn-fixed.fade-in {
        opacity: 1;
      }

      /* Names Overlay Styles Inside Video Box */
      #video-names-overlay {
        position: absolute;
        top: 36%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 520px;
        text-align: center;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.6s ease-in-out;
      }
      #video-names-overlay.overlay-visible {
        opacity: 1 !important;
      }
      .glow-bg {
        position: absolute;
        inset: -20px;
        background: radial-gradient(ellipse at center, rgba(212,169,79,0.18) 0%, rgba(212,169,79,0) 70%);
        pointer-events: none;
        z-index: -1;
      }
      .overlay-line1 {
        font-family: 'Jost', sans-serif;
        font-weight: 300;
        color: #f0d9a0;
        letter-spacing: 0.3em;
        font-size: clamp(11px, 2.6vw, 14px);
        margin: 0 0 8px 0;
        text-transform: uppercase;
      }
      .overlay-line2 {
        font-family: 'Pinyon Script', 'Great Vibes', cursive;
        color: #d4a94f;
        text-shadow: 0 0 12px rgba(212,169,79,0.45);
        font-size: clamp(40px, 11vw, 72px);
        margin: 0;
        line-height: 1.1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.25em;
      }
      .overlay-line2 span {
        display: inline-block;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.9s ease-out, transform 0.9s ease-out;
      }
      #video-names-overlay.overlay-visible .groom-name {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.2s;
      }
      #video-names-overlay.overlay-visible .ampersand {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 0.6s;
        font-size: 0.7em;
      }
      #video-names-overlay.overlay-visible .bride-name {
        opacity: 1;
        transform: translateY(0);
        transition-delay: 1.0s;
      }
      .overlay-divider {
        width: 60px;
        height: 1px;
        background: #d4a94f;
        margin: 12px auto;
        opacity: 0.8;
      }
      .overlay-parents {
        font-family: 'Cormorant Garamond', serif;
        color: #f7efdc;
        font-size: clamp(12px, 3vw, 16px);
        margin: 4px 0;
        line-height: 1.3;
      }

      /* Invitation card initial state */
      #invitation-card {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 1.2s ease-in-out;
      }
      #invitation-card.invitation-card-visible {
        opacity: 1 !important;
        pointer-events: auto !important;
        visibility: visible !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        const SHOW_CODE_NAMES = false;   // false: the names come from the video itself. true: the names are drawn by code on the wall.
        const FINAL_VIDEO_SRC = "https://drive.google.com/uc?export=download&id=1yYMLp3XppaSV6__GcE_4FkmUQeAjR72_";
        const VIDEO_CANDIDATES = [
          "/video.mp4",
          FINAL_VIDEO_SRC,
          "https://lh3.googleusercontent.com/d/1yYMLp3XppaSV6__GcE_4FkmUQeAjR72_"
        ];

        let candidateIndex = 0;
        let skipBtn = null;
        let fadeInTimer = null;
        let canplayReached = false;
        let canplayTimer = null;
        let overlayShown = false;
        let envelopeTapEl = null;
        let envelopeTapTimer = null;

        function setupEnvelopeTapText() {
          if (envelopeTapEl) return;
          envelopeTapEl = document.createElement('div');
          envelopeTapEl.id = 'envelope-tap-text';
          envelopeTapEl.className = 'envelope-tap-text';
          envelopeTapEl.textContent = 'Tap to open';

          const envContainer = document.querySelector('.z-50.fixed.inset-0') || document.body;
          envContainer.appendChild(envelopeTapEl);

          envelopeTapTimer = setTimeout(function() {
            if (envelopeTapEl) {
              const currentEnv = document.querySelector('.z-50.fixed.inset-0');
              if (currentEnv && envelopeTapEl.parentNode !== currentEnv) {
                currentEnv.appendChild(envelopeTapEl);
              }
              envelopeTapEl.classList.add('visible');
            }
          }, 1000);

          function removeEnvelopeTapText() {
            if (envelopeTapTimer) {
              clearTimeout(envelopeTapTimer);
              envelopeTapTimer = null;
            }
            if (envelopeTapEl) {
              envelopeTapEl.classList.remove('visible');
              const el = envelopeTapEl;
              envelopeTapEl = null;
              setTimeout(function() {
                if (el && el.parentNode) {
                  el.parentNode.removeChild(el);
                }
              }, 800);
            }
          }

          document.addEventListener('click', removeEnvelopeTapText, { once: true, capture: true });
          document.addEventListener('touchstart', removeEnvelopeTapText, { once: true, capture: true, passive: true });
        }

        function showOverlay(video, isFallback) {
          if (overlayShown) return;
          overlayShown = true;

          console.log("OVERLAY_SHOWN");

          const container = (video && video.parentElement) || document.getElementById('video-container') || document.body;

          if (isFallback) {
            container.style.backgroundColor = '#08162b';
          }

          if (SHOW_CODE_NAMES) {
            let overlay = document.getElementById('video-names-overlay');
            if (!overlay) {
              overlay = document.createElement('div');
              overlay.id = 'video-names-overlay';
              overlay.innerHTML = `
                <div class="glow-bg"></div>
                <p class="overlay-line1">Shri Radhe Krishna ki kripa se</p>
                <h1 class="overlay-line2">
                  <span class="groom-name">Aarav</span>
                  <span class="ampersand">&amp;</span>
                  <span class="bride-name">Ananya</span>
                </h1>
                <div class="overlay-divider"></div>
                <p class="overlay-parents">Mr. &amp; Mrs. Rajesh Sharma</p>
                <p class="overlay-parents">Mr. &amp; Mrs. Sunil Verma</p>
              `;
              container.appendChild(overlay);
            }

            void overlay.offsetWidth;
            overlay.classList.add('overlay-visible');
          }

          // Reveal invitation card below video & unlock scrolling
          const invCard = document.getElementById('invitation-card') || document.querySelector('section:nth-of-type(2)') || document.querySelectorAll('section')[1];
          if (invCard) {
            invCard.classList.add('invitation-card-visible');
          }

          try {
            document.documentElement.style.overflow = 'auto';
            document.body.style.overflow = 'auto';
            document.body.style.touchAction = 'auto';
          } catch (err) {
            console.warn('Scroll unlock error:', err);
          }
        }

        function createSkipButton(video) {
          if (skipBtn) return;

          skipBtn = document.createElement('button');
          skipBtn.className = 'skip-btn-fixed';
          skipBtn.textContent = 'Skip';
          skipBtn.type = 'button';

          function onSkipTap(e) {
            if (e) {
              e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
            }

            console.log('Skip button tapped');

            if (video) {
              try {
                if (!video.paused) {
                  video.pause();
                }
              } catch (err) {
                console.warn('Skip pause warning:', err);
              }
            }

            showOverlay(video, true);

            const invCard = document.getElementById('invitation-card') || document.querySelector('section:nth-of-type(2)') || document.querySelectorAll('section')[1];
            if (invCard) {
              invCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
              window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
            }
          }

          skipBtn.addEventListener('click', onSkipTap, true);
          skipBtn.addEventListener('touchstart', onSkipTap, { capture: true, passive: false });

          document.body.appendChild(skipBtn);

          fadeInTimer = setTimeout(function() {
            if (skipBtn) {
              skipBtn.classList.add('fade-in');
            }
          }, 500);
        }

        function showChhooKarDekhiye(video) {
          let promptEl = document.getElementById('tap-to-play-prompt');
          if (promptEl) return;

          promptEl = document.createElement('div');
          promptEl.id = 'tap-to-play-prompt';
          promptEl.style.cssText = 'position:absolute;top:calc(50% + 54px);left:50%;transform:translateX(-50%);z-index:99999;color:#0e5f68;font-family:\'Pinyon Script\',cursive;font-weight:400;font-size:clamp(26px,7vw,36px);letter-spacing:0.02em;cursor:pointer;text-align:center;pointer-events:auto;text-shadow:0 0 8px rgba(255,255,255,0.6),0 1px 2px rgba(8,22,43,0.25);white-space:nowrap;';
          promptEl.textContent = 'Tap to open';

          function handlePromptTap(e) {
            if (e) {
              e.stopPropagation();
              if (e.preventDefault) e.preventDefault();
            }
            if (promptEl && promptEl.parentNode) {
              promptEl.parentNode.removeChild(promptEl);
            }
            if (video) {
              video.muted = false;
              video.play().catch(function(err) {
                console.warn('Re-play on tap error:', err);
              });
            }
          }

          promptEl.addEventListener('click', handlePromptTap, true);
          promptEl.addEventListener('touchstart', handlePromptTap, { capture: true, passive: false });

          document.body.appendChild(promptEl);
        }

        function attemptVideoPlay(video) {
          if (!video) return;
          video.muted = false;
          const promise = video.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(function(err) {
              console.warn('play() rejected:', err);
              showChhooKarDekhiye(video);
            });
          }
        }

        function observeVideo() {
          setupEnvelopeTapText();

          function checkVideo() {
            const video = document.querySelector('video');
            if (video) {
              if (!video.dataset.srcUpdated) {
                video.dataset.srcUpdated = 'true';
                video.removeAttribute('crossorigin');
                video.removeAttribute('crossOrigin');
                video.muted = false;
                video.setAttribute('playsinline', '');
                video.setAttribute('preload', 'auto');
                video.src = VIDEO_CANDIDATES[candidateIndex];
                try {
                  video.load();
                } catch (err) {
                  console.warn('Video load warning:', err);
                }
              }

              if (!video.dataset.skipBound) {
                video.dataset.skipBound = 'true';

                video.addEventListener('loadstart', function() {
                  console.log('loadstart');
                });

                video.addEventListener('loadeddata', function() {
                  console.log('loadeddata');
                });

                video.addEventListener('canplay', function() {
                  canplayReached = true;
                  console.log('canplay');
                  if (canplayTimer) {
                    clearTimeout(canplayTimer);
                    canplayTimer = null;
                  }
                });

                video.addEventListener('playing', function() {
                  console.log('playing');
                  createSkipButton(video);
                });

                video.addEventListener('stalled', function() {
                  console.log('stalled');
                });

                video.addEventListener('waiting', function() {
                  console.log('waiting');
                });

                // Listen to timeupdate: when currentTime >= duration - 2.0s
                video.addEventListener('timeupdate', function() {
                  if (!overlayShown && video.duration && !isNaN(video.duration) && video.duration > 0) {
                    if (video.currentTime >= video.duration - 2.0) {
                      showOverlay(video, false);
                    }
                  }
                });

                video.addEventListener('ended', function() {
                  console.log('Video ended event');
                  showOverlay(video, false);
                });

                video.addEventListener('error', function() {
                  const code = video.error ? video.error.code : null;
                  const msg = video.error ? video.error.message : null;
                  console.log('error', code, msg);

                  if (candidateIndex < VIDEO_CANDIDATES.length - 1) {
                    candidateIndex++;
                    console.log('Trying fallback video source:', VIDEO_CANDIDATES[candidateIndex]);
                    video.src = VIDEO_CANDIDATES[candidateIndex];
                    try {
                      video.load();
                      attemptVideoPlay(video);
                    } catch (e) {
                      console.warn('Fallback video load error:', e);
                    }
                  } else {
                    showOverlay(video, true);
                  }
                });

                video.addEventListener('play', function() {
                  createSkipButton(video);
                });

                // 8-second canplay timeout check
                canplayTimer = setTimeout(function() {
                  if (!canplayReached) {
                    console.log('VIDEO_TIMEOUT');
                    showOverlay(video, true);
                  }
                }, 8000);
              }

              if (!video.dataset.tapBound) {
                video.dataset.tapBound = 'true';

                const handleTapToPlay = function() {
                  attemptVideoPlay(video);
                };

                document.addEventListener('click', handleTapToPlay, { once: false, capture: true });
                document.addEventListener('touchstart', handleTapToPlay, { once: false, capture: true, passive: true });

                window.addEventListener('opening:complete', function() {
                  attemptVideoPlay(video);
                });
              }
            }
          }

          const observer = new MutationObserver(checkVideo);
          observer.observe(document.body, { childList: true, subtree: true });
          checkVideo();
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', observeVideo);
        } else {
          observeVideo();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
